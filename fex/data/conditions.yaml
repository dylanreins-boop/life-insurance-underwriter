# Canonical health conditions asked about on final expense applications.
#
# `aliases` feed the free-text matcher, so they should include the words a
# client actually says ("sugar", "mini stroke", "water pill") as well as the
# clinical term. `followups` are the detail questions that carrier rules key
# off; the engine only asks the ones a matched rule actually needs.
#
# followup types: bool | int | months | years | enum | float

- id: heart_attack
  label: Heart attack (myocardial infarction)
  category: cardiovascular
  aliases: [heart attack, myocardial infarction, mi, coronary, widowmaker, cardiac arrest]
  followups:
    - {key: months_since_event, type: months, question: "How many months since the heart attack?"}
    - {key: count, type: int, question: "How many heart attacks in total?"}

