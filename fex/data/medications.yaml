# Medication -> condition inference.
#
# `confidence` controls what the engine does with a match:
#   high    the condition is added to the applicant automatically
#   medium  the condition is added, but flagged for the agent to confirm
#   low     nothing is added; the engine raises a question instead, because the
#           drug has several common indications and guessing would be wrong
#
# `set` writes attributes onto the implied condition (e.g. an insulin product
# sets `insulin: true` on diabetes, which is what actually moves the tier).
# `flags` are free-form markers carrier rules can match on as conditions.

