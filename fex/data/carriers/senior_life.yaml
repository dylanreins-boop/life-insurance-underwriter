id: senior_life
name: Senior Life Insurance Company
am_best: "NR"
verified: false
as_of: "2026-08"
source_note: >-
  Seeded from general market knowledge of this carrier's final expense
  portfolio. Verify against the current field underwriting guide.
rate_index: 1.18
underwriting_style: Very liberal health questions; takes risks most carriers decline.
notes:
  - Higher premium, but a real option when the alternative is guaranteed issue.
build:
  bmi: {min: 16, level_max: 45, graded_max: 52}
products:
  - id: guaranteed_issue_wl
    name: Guaranteed Issue Whole Life
    tier: gi
    bypass_underwriting: true
    issue_ages: {min: 50, max: 85}
    face: {min: 1000, max: 20000}
    benefit_schedule: Return of premium plus interest for 2 years; full benefit after.
  - id: level_wl
    name: Level Benefit Whole Life
    tier: level
    issue_ages: {min: 0, max: 85}
    face: {min: 1000, max: 30000}
    benefit_schedule: Full death benefit from day one.
  - id: graded_wl
    name: Graded Benefit Whole Life
    tier: graded
    issue_ages: {min: 0, max: 85}
    face: {min: 1000, max: 20000}
    benefit_schedule: Years 1-2 pay a reduced benefit; full benefit from year 3.
underwriting:
  extends: [core_knockouts, level_screen_standard, level_screen_liberal, graded_screen_standard]
  disable: [ko_paralysis, ko_scleroderma, ko_aplastic_anemia]
