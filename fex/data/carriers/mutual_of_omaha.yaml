underwriting:
  # The health questions themselves are not in the guide, so these remain the
  # shared market defaults. The two carrier-specific rules that used to sit here
  # were invented rather than sourced, and have been removed.
  #
  # Deliberately no graded_screen: the guide describes exactly two underwritten
  # outcomes. A Part One 'yes' ends the application and a Part Two 'yes' means
  # the Graded plan, so there is no third, worse tier to fall to. Including the
  # graded screen produced 'modified' findings, and because Living Promise has
  # no modified plan those were silently landing clients on guaranteed issue.
  extends: [core_knockouts, level_screen_standard]
