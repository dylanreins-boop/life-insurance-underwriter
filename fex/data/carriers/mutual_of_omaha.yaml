products:
  - id: living_promise_level
    name: Living Promise Level Benefit
    tier: level
    verified: true
    issue_ages: {min: 45, max: 85}
    face: {min: 2000, max: 40000}
    benefit_schedule: Full death benefit from day one.
    notes:
      - "In WA the minimum face amount is $5,000."
      - "Underwriting classes: Standard Tobacco and Standard Nontobacco."

  - id: living_promise_graded
    name: Living Promise Graded Benefit
    tier: graded
    verified: true
    issue_ages: {min: 45, max: 80}
    face: {min: 2000, max: 20000}
    states_excluded: [AR, MT, NC]
    benefit_schedule: >-
      Death from natural causes in the first two years returns all premiums paid
      plus 10 percent; the full benefit is paid after two years. Accidental death
      pays the full benefit in all years.
    notes:
      - "In WA the minimum face amount is $5,000."
      - "One underwriting class - there is no tobacco distinction on this plan."

  - id: gwl
    name: Guaranteed Whole Life
    tier: gi
    verified: false
    bypass_underwriting: true
    issue_ages: {min: 45, max: 85}
    face: {min: 2000, max: 25000}
    benefit_schedule: Return of premium plus 10% for the first 2 years; full benefit after.
    notes:
      - "Not covered by the Living Promise guide - these specs are still an
         unverified default. Supply the Guaranteed Whole Life guide to confirm them."

# Transcribed from the guide's medication list. Drugs marked with an asterisk in
# the guide "may qualify for the Graded benefit product"; the rest make the
# applicant ineligible for Living Promise entirely.
