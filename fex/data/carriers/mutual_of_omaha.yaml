id: mutual_of_omaha
name: Mutual of Omaha (United of Omaha)
am_best: "A+"

# The Living Promise guide settles the products, the build chart, the rates and
# the medication list. It does NOT print the Part One / Part Two health
# questions themselves - those live on the application - so the condition rules
# below are still the shared market defaults. That is why the carrier flag stays
# false while the individual products are marked verified.
verified: false
as_of: "Living Promise Product and Underwriting Guide, form 128042"
source_note: >-
  Products, build chart, premium rates, policy fee, modal factors and the
  medication list are transcribed from the Living Promise Product and
  Underwriting Guide (form 128042). The Part One and Part Two health questions
  are not printed in that guide, so the condition rules remain unverified market
  defaults until the Living Promise application is supplied.

rate_index: 1.0
underwriting_style: >-
  Point-of-sale decision through an Apptical phone interview, with an MIB check
  and a prescription history check run during the call.
states_excluded: [NY]      # United of Omaha does not conduct business in New York
notes:
  - "Application structure: any Part One 'yes' means no coverage at all; any Part Two
     'yes' means the Graded plan only; all 'no' answers mean the Level plan."
  - "Non-tobacco rates require no tobacco or nicotine in any form - gum, patches,
     cigars included - for the 12 months before the application."
  - "Combined limits: no more than $40,000 of Living Promise Level, and no more than
     $50,000 of all simplified issue coverage with United of Omaha. Graded is capped
     at $20,000, and $25,000 across all graded coverage with United of Omaha."
  - "Suicide exclusion for both plans: premiums returned, less any loan, within two
     years of the contestability date (one year in ND)."

