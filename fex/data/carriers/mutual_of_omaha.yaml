id: mutual_of_omaha
name: Mutual of Omaha
am_best: "A+"
verified: false
as_of: "2026-08"
source_note: >-
  Seeded from general market knowledge of this carrier's final expense
  portfolio. Not transcribed from the carrier's field underwriting guide.
  Verify every rule against the current guide before quoting a client.
rate_index: 0.97
underwriting_style: Point-of-sale decision with prescription check and MIB.
notes:
  - Strong brand recognition, which helps at the kitchen table.
  - Level and Graded are separate plans; the application determines which one issues.
build:
  bmi: {min: 17, level_max: 40, graded_max: 46}
products:
  - id: living_promise_level
    name: Living Promise Level Benefit
    tier: level
    issue_ages: {min: 45, max: 85}
    face: {min: 2000, max: 40000}
    benefit_schedule: Full death benefit from day one.
  - id: living_promise_graded
    name: Living Promise Graded Benefit
    tier: graded
    issue_ages: {min: 45, max: 80}
    face: {min: 2000, max: 20000}
    benefit_schedule: Years 1-2 pay 40% of face; full benefit from year 3.
  - id: gwl
    name: Guaranteed Whole Life
    tier: gi
    bypass_underwriting: true
    issue_ages: {min: 45, max: 85}
    face: {min: 2000, max: 25000}
    benefit_schedule: Return of premium plus 10% for the first 2 years; full benefit after.
underwriting:
  extends: [core_knockouts, level_screen_standard, graded_screen_standard]
  rules:
    - id: moo_insulin_early
      label: Insulin started before age 30
      conditions: [diabetes_type1, diabetes_type2]
      when: {age_at_diagnosis: {lt: 30}, insulin: true}
      outcome: decline
    - id: moo_copd
      label: COPD or emphysema
      conditions: [copd]
      outcome: graded
