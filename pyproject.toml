[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fex-underwriter"
version = "0.1.0"
description = "Final expense whole life underwriting eligibility and quoting engine"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PyYAML>=5.4"]

[project.scripts]
fex = "fex.cli:main"

[tool.setuptools.packages.find]
include = ["fex*"]

[tool.setuptools.package-data]
fex = ["data/*.yaml", "data/carriers/*.yaml", "data/rates/*.yaml"]
